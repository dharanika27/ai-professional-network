[project]
name = "ai-professional-network-backend"
version = "0.1.0"
description = "AI Professional Network — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Core web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Pydantic & settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    # Embeddings
    "sentence-transformers>=3.0.0",
    "torch>=2.4.0",
    # Auth & security (future groups, declared here for completeness)
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    # HTTP
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-env>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "-v",
    "--tb=short",
]
env = [
    "DATABASE_URL=postgresql://app:app@localhost:5433/ai_professional_network",
    "JWT_SECRET=test-secret-not-a-real-key-for-pytest-only",
    "EMBEDDING_MODEL=BAAI/bge-small-en-v1.5",
    "EMBEDDING_DIM=384",
    "MAX_UPLOAD_MB=5",
    "RESUME_MAX_BYTES=5242880",
    "STORAGE_DIR=./.local_resume_store",
    "FRONTEND_ORIGIN=http://localhost:3000",
    "LLM_PROVIDER=groq",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "BLE", # flake8-blind-except (with override in health.py)
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # allow non-snake_case in tests
"migrations/*" = ["N999"]     # migration filenames can't follow module conventions

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = "app.types.*"
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "ruff>=0.15.20",
]
